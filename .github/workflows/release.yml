name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.4.4)'
        required: true
        default: 'v1.4.4'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          TITLE="${TAG} - Household Scoreboard Card"
          echo "Creating release for $TAG ($TITLE)..."
          
          # Delete existing draft/release for this tag if it exists
          gh release delete "$TAG" --yes 2>/dev/null || true
          
          if ! gh release create "$TAG" \
            household-scoreboard-card.js \
            dist/household-scoreboard-card.js \
            --title "$TITLE" \
            --generate-notes; then
            echo "::error::Release creation failed. Check if 'Read and write permissions' are enabled under Settings -> Actions -> General -> Workflow permissions."
            exit 1
          fi
