name: "Validate"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v4"

      - name: "HACS Action"
        uses: "hacs/action@main"
        with:
          category: "plugin"
